server {
    listen 3000;
    listen [::]:3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Main routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable cache for HTML files so changes reflect immediately
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # CSS & JS assets (cached with revalidation, cache-busting handled via query param)
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate" always;
        access_log off;
    }

    # Static media and font assets cache
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    # Error handling
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
