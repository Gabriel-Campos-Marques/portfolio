name: CI/CD - Build & Push Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build e Push para Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Conectar na Tailnet do Homelab
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push para o Registry Próprio
        run: |
          docker build -t registry.gmdevworks.com.br/portfolio:latest .
          docker push registry.gmdevworks.com.br/portfolio:latest
